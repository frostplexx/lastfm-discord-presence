name: Build & Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  SDK_VERSION: 1.9.17379

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # ── Discord Social SDK (cached) ────────────────────────────────────
      # DISCORD_SDK_URL is a signed Google Storage URL valid ~1hr.
      # Cache persists across runs — re-fetch only on version bump.
      - name: Cache Discord SDK
        id: cache-sdk
        uses: actions/cache@v6
        with:
          path: vendor/discord-sdk
          key: discord-sdk-${{ env.SDK_VERSION }}

      - name: Download SDK (cache miss)
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          set -ex
          mkdir -p vendor/discord-sdk vendor/_tmp
          curl --retry 3 --retry-delay 5 -sL "${{ secrets.DISCORD_SDK_URL }}" -o sdk.zip
          unzip -q sdk.zip -d vendor/_tmp
          rm sdk.zip
          # Locate discordpp.h regardless of zip's top-level structure
          src=$(find vendor/_tmp -name discordpp.h -print -quit 2>/dev/null)
          if [ -z "$src" ]; then
            echo "discordpp.h not found in zip"
            exit 1
          fi
          # SDK root = grandparent of the file's directory
          #   src=.../DiscordSdk-x/include/discordpp.h → root=.../DiscordSdk-x
          #   src=.../include/discordpp.h              → root=...
          sdk_root=$(cd "$(dirname "$src")/.." && pwd -P)
          mv "$sdk_root"/* vendor/discord-sdk/
          mv "$sdk_root"/.* vendor/discord-sdk/ 2>/dev/null || true
          rm -rf vendor/_tmp
          test -f vendor/discord-sdk/include/discordpp.h

      - name: Place SDK where Docker expects it
        run: |
          mkdir -p lib
          rm -rf lib/discord_social_sdk
          cp -r vendor/discord-sdk lib/discord_social_sdk
          test -f lib/discord_social_sdk/include/discordpp.h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=sha,prefix=

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64

      # Discord Social SDK ships x86-64 .so only (no arm64 Linux .so).
      # We publish a multi-arch manifest so Docker on arm64 pulls this
      # amd64 image and runs it transparently via QEMU. When Discord
      # ships an arm64 .so, switch to native arm64 builds here.
      #
      # docker manifest create with the same source twice then annotate
      # overwrites the platform on both entries (same ref match), losing
      # the amd64 entry. Instead we construct the OCI index manually and
      # push via the registry API.
      - name: Add arm64 manifest entries (QEMU-compatible)
        run: |
          tags=$(echo '${{ steps.meta.outputs.json }}' | jq -r '.tags[]')
          digest=${{ steps.build.outputs.digest }}

          for tag in $tags; do
            repo="${tag%:*}"
            tag_name="${tag#*:}"
            registry_repo="${repo#ghcr.io/}"

            echo "--- Processing $tag ---"

            # Get OCI index pushed by buildx and extract amd64 sub-manifest digest
            raw=$(docker buildx imagetools inspect --raw "$repo@$digest")
            echo "raw type: $(echo "$raw" | jq -r '.mediaType // "unknown"')"

            amd64_digest=$(echo "$raw" | jq -r '.manifests[] | select(.platform.architecture == "amd64" and .platform.os == "linux") | .digest // empty')

            if [ -z "$amd64_digest" ]; then
              # Single manifest — use directly; get size
              amd64_digest="$digest"
              size=$(echo "$raw" | jq -r '.layers | map(.size) | add // 0')
            else
              # Size from parent index entry
              size=$(echo "$raw" | jq -r '.manifests[] | select(.digest == "'$amd64_digest'") | .size // 0')
            fi

            # Get sub-manifest media type
            sub_raw=$(docker buildx imagetools inspect --raw "$repo@$amd64_digest")
            sub_mediaType=$(echo "$sub_raw" | jq -r '.mediaType')

            # Normalize size to integer
            size="${size%%[!0-9]*}"
            size="${size:-0}"
            echo "amd64_digest: $amd64_digest   sub_mediaType: $sub_mediaType   size: $size"

            # Exchange Docker credentials for a registry token (more reliable than raw GITHUB_TOKEN)
            encoded=$(cat ~/.docker/config.json | jq -r '.auths["ghcr.io"].auth // .auths["https://ghcr.io"].auth // empty' 2>/dev/null)
            decoded=$(echo "$encoded" | base64 -d 2>/dev/null || true)
            userpass="${decoded:-:}"
            token=$(curl -s -u "$userpass" \
              "https://ghcr.io/token?scope=repository:${registry_repo}:pull,push" | jq -r '.token')

            if [ -z "$token" ] || [ "$token" = "null" ]; then
              echo "ERROR: failed to get registry token"
              exit 1
            fi

            # Fallback: if size is still 0, get it from Content-Length
            if [ "$size" = "0" ]; then
              size=$(curl -sI \
                -H "Authorization: Bearer $token" \
                -H "Accept: $sub_mediaType" \
                "https://ghcr.io/v2/${registry_repo}/manifests/${amd64_digest}" | \
                grep -i content-length | tail -1 | awk '{print $2}' | tr -cd '0-9')
              size="${size:-0}"
            fi

            # Build OCI index with amd64 + arm64 entries (same image, arm64 runs via QEMU)
            index=$(jq -n \
              --arg mt "$sub_mediaType" \
              --arg d "$amd64_digest" \
              --argjson s "$size" \
              '{
                schemaVersion: 2,
                mediaType: "application/vnd.oci.image.index.v1+json",
                manifests: [
                  {mediaType: $mt, digest: $d, size: $s, platform: {architecture: "amd64", os: "linux"}},
                  {mediaType: $mt, digest: $d, size: $s, platform: {architecture: "arm64", os: "linux", variant: "v8"}}
                ]
              }')

            echo "Pushing multi-arch manifest for $tag"
            echo "$index" | head -5
            response=$(curl -s -w "\n%{http_code}" -X PUT \
              -H "Authorization: Bearer $token" \
              -H "Content-Type: application/vnd.oci.image.index.v1+json" \
              -d "$index" \
              "https://ghcr.io/v2/${registry_repo}/manifests/${tag_name}")
            http_code=$(echo "$response" | tail -1)
            body=$(echo "$response" | sed '$d')
            echo "HTTP $http_code: $body"

            if [ "$http_code" != "201" ]; then
              echo "ERROR: failed to push manifest list"
              exit 1
            fi

            # Verify the manifest list was stored
            echo "Verifying..."
            docker buildx imagetools inspect "$tag" 2>&1 | head -10
          done
