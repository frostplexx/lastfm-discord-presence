services:
  lastfm-presence:
    image: ghcr.io/${GITHUB_REPOSITORY:-lastfm-discord-presence}/lastfm-discord-presence:main
    container_name: lastfm-presence
    environment:
      - DISCORD_APP_ID=${DISCORD_APP_ID:?err}
      - MUSIC_SOURCE=${MUSIC_SOURCE:-lastfm,navidrome}
      # Required if lastfm is in MUSIC_SOURCE:
      - LASTFM_API_KEY=${LASTFM_API_KEY:-}
      - LASTFM_USER=${LASTFM_USER:-}
      # Required if navidrome is in MUSIC_SOURCE (admin creds needed to
      # see another user's now-playing status — see README):
      - NAVIDROME_HOST=${NAVIDROME_HOST:-}
      - NAVIDROME_ADMIN_USERNAME=${NAVIDROME_ADMIN_USERNAME:-}
      - NAVIDROME_ADMIN_PASSWORD=${NAVIDROME_ADMIN_PASSWORD:-}
      - NAVIDROME_USERNAME=${NAVIDROME_USERNAME:-}
      - SOURCE_POLL_INTERVAL_SEC=${SOURCE_POLL_INTERVAL_SEC:-10}
      - SOURCE_SHOW_BUTTON=${SOURCE_SHOW_BUTTON:-1}
      - SOURCE_SHOW_SMALL_IMAGE=${SOURCE_SHOW_SMALL_IMAGE:-1}
      - DISCORD_TOKEN_FILE=/data/token
    volumes:
      - lastfm-token:/data
    restart: unless-stopped

volumes:
  lastfm-token:
